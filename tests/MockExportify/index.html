<!doctype html>
<!--
    Mock of exportify.net for end-to-end testing Mp3PlayerSync without a Spotify account.
    It mirrors https://exportify.net/index.html and runs Exportify's exportify.js and FileSaver.js unchanged, from copies
    in vendor (see tests\Update-MockExportifyVendor.ps1), like the libraries the page loads, so it needs no internet;
    only the Spotify Web API (fake-spotify.js) and the Spotify login redirect (fake-login.html) are faked.
-->
<html lang="en">
<head>
	<title>Exportify (mock)</title>
	<meta charset="utf-8">
	<script>let code = new URLSearchParams(location.search).get('code'); if (code) history.replaceState({}, '', '/')</script>
	<!-- Test switches: ?expireToken makes the stored access token more than an hour old, and ?expireWhenAsked makes it
	     run out while the page is open, when a test asks the mock (Start-MockExportify.ps1's expire). Either way the
	     fake API stops accepting it. -->
	<script>
		const expireToken = () => {
			localStorage.setItem('access_token_timestamp', '0')
			localStorage.setItem('mock_expired_token', localStorage.getItem('access_token'))
		}
		if (new URLSearchParams(location.search).has('expireToken')) expireToken()
		const mockFetch = window.fetch.bind(window) // fake-spotify.js replaces fetch with the fake Spotify API
		if (new URLSearchParams(location.search).has('expireWhenAsked')) setInterval(async () => {
			if (await mockFetch('/expire', { cache: 'no-store' }).then(r => r.text()).catch(() => '') !== 'expire') return
			expireToken()
			document.body.append(document.createElement('i')) // Nudges the app's page observer
		}, 250)
	</script>
	<link rel="stylesheet" href="vendor/bootstrap.min.css">
	<link rel="stylesheet" href="vendor/font-awesome.min.css">
	<script src="vendor/react.production.min.js"></script>
	<script src="vendor/react-dom.production.min.js"></script>
	<script src="vendor/exportify/FileSaver.js"></script>
	<script src="vendor/jszip.min.js"></script>
	<link rel="stylesheet" href="vendor/exportify/style.css">
	<script src="demo-library.js"></script>
	<script src="fake-spotify.js"></script>
	<script src="vendor/exportify/exportify.js"></script>
	<!-- Spotify only accepts exportify.net as a redirect URI, so the login step goes to a local fake instead.
	     Test switch: ?autoSignIn makes the fake login page sign in by itself. -->
	<script>
		const autoSignIn = new URLSearchParams(location.search).has('autoSignIn')
		utils.authorize = () => { location = 'http://127.0.0.1:' + location.port + '/fake-login.html' + (autoSignIn ? '?auto' : '') }
	</script>
</head>

<body>
	<div class="container">
		<div id="header">
			<div id="logoutContainer" class="text-right"></div>
			<h1><i class="fa fa-spotify" style="color: #65D36E"></i> Exportify (mock)</h1>
			<p id="subtitle" class="lead">Export your Spotify playlist data.</p>
			<p id="error"></p>
			<button id="loginButton" type="submit" class="btn btn-lg" onclick="utils.authorize()">
				<i class="fa fa-check-circle-o"></i> Get Started
			</button>
		</div>
		<div id="playlistsContainer"></div>
	</div>
</body>
</html>
