<!doctype html>
<!--
    Records what a web page can see of its browser, to check that the app's embedded Exportify looks like plain Edge.
    Posts its findings to the mock server's /report, then repeats on the other origin (127.0.0.1) once.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Fingerprint</title>
</head>
<body>
	<p>Collecting…</p>
	<script>
		(async () => {
			const r = { origin: location.origin, phase: 'load' }
			const describe = f => { try { return typeof f === 'function' ? Function.prototype.toString.call(f) : String(f) } catch (e) { return 'throws ' + e } }

			r.userAgent = navigator.userAgent
			r.webdriver = navigator.webdriver
			r.plugins = navigator.plugins.length
			r.mimeTypes = navigator.mimeTypes.length
			r.languages = navigator.languages
			r.brands = navigator.userAgentData?.brands
			try { r.highEntropy = await navigator.userAgentData?.getHighEntropyValues(['fullVersionList', 'platformVersion', 'architecture', 'bitness', 'model', 'wow64']) } catch (e) { r.highEntropy = 'throws ' + e }

			r.chromeKeys = window.chrome ? Object.getOwnPropertyNames(window.chrome) : null
			r.chromeWebview = typeof window.chrome?.webview
			r.webviewInChrome = !!window.chrome && 'webview' in window.chrome

			r.visibilityState = document.visibilityState
			r.hidden = document.hidden

			r.toString = {
				createObjectURL: describe(URL.createObjectURL),
				click: describe(HTMLElement.prototype.click),
				dispatchEvent: describe(EventTarget.prototype.dispatchEvent),
				functionToString: describe(Function.prototype.toString),
				functionToStringOfToString: describe(Function.prototype.toString.toString),
				saveAs: describe(window.saveAs),
			}
			r.ownProperties = {
				anchorClick: Object.prototype.hasOwnProperty.call(HTMLAnchorElement.prototype, 'click'),
				anchorDispatchEvent: Object.prototype.hasOwnProperty.call(HTMLAnchorElement.prototype, 'dispatchEvent'),
				createObjectURLPrototype: 'prototype' in URL.createObjectURL,
			}

			// Globals that a fresh window (an iframe) doesn't have
			const frame = document.body.appendChild(document.createElement('iframe'))
			const baseline = new Set(Object.getOwnPropertyNames(frame.contentWindow))
			r.extraGlobals = Object.getOwnPropertyNames(window).filter(name => !baseline.has(name))
			r.iframeChromeWebview = typeof frame.contentWindow.chrome?.webview
			frame.remove()

			r.requestHeaders = await (await fetch('/echo-headers')).json()

			await fetch('/report', { method: 'POST', body: JSON.stringify(r) })

			if (location.hostname === 'localhost' && !location.search.includes('done'))
				location = 'http://127.0.0.1:' + location.port + '/fingerprint.html?done'
			else
				document.body.textContent = 'Done'
		})()
	</script>
</body>
</html>
