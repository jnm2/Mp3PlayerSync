<?xml version="1.0" encoding="UTF-8"?>
<!-- Mp3PlayerSync app icon, hand-hinted for exactly 20 x 20 px: edges on whole pixels, detail simplified. -->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <linearGradient id="body" x1="0" y1="0.21" x2="1" y2="0.79">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="0.5" stop-color="#6A58F0"/>
      <stop offset="1" stop-color="#4A35CF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4F3FF"/>
      <stop offset="1" stop-color="#6DD0FA"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6FF"/>
    </linearGradient>
  </defs>

  <rect x="3" y="0" width="14" height="20" rx="1.5" fill="url(#body)"/>
  <rect x="5" y="2" width="10" height="8" rx="0.5" fill="url(#screen)"/>
  <!-- Beamed note with a level beam so every edge lands on a pixel. -->
  <g fill="#3221A8">
    <rect x="6" y="7" width="3" height="2" rx="0.6"/>
    <rect x="11" y="7" width="3" height="2" rx="0.6"/>
    <rect x="8" y="3" width="1" height="5"/>
    <rect x="13" y="3" width="1" height="5"/>
    <rect x="8" y="3" width="6" height="2"/>
  </g>
  <circle cx="10" cy="15" r="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>
