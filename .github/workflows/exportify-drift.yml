name: Exportify changed, so update the mock's copies

# The mock Exportify runs copies of exportify.net's files (tests\MockExportify\vendor), so the end-to-end tests don't
# depend on the internet. This says when exportify.net has changed since, so the copies can be updated in a pull
# request, where CI runs the end-to-end tests on them.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the mock's copies with exportify.net
        shell: pwsh
        run: tests/Update-MockExportifyVendor.ps1 -Check
